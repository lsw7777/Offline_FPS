; Project WB - input (legacy fallback mappings).
; NOTE: the primary scheme is Enhanced Input (InputMappingContext assets authored
; in-editor, see Docs/UE_INSTALL.md step 6). These legacy mappings keep the pawn
; drivable before the IMC assets exist.

[/Script/Engine.InputSettings]
bEnableMouseSmoothing=False
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="LookUp",Scale=-1.0,Key=MouseY)
+AxisMappings=(AxisName="Turn",Scale=1.0,Key=MouseX)

+ActionMappings=(ActionName="Fire",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=LeftMouseButton)
+ActionMappings=(ActionName="Aim",Key=RightMouseButton)
+ActionMappings=(ActionName="Reload",Key=R)
+ActionMappings=(ActionName="Melee",Key=V)
+ActionMappings=(ActionName="Sprint",Key=LeftShift)
+ActionMappings=(ActionName="Crouch",Key=LeftControl)
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
